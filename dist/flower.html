<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>花 · Flower</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌸</text></svg>" />
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; padding:0; height:100%; overflow:hidden; background:#0b1016;
    font-family: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #app { position:fixed; inset:0; }
  /* 手机上必须禁用浏览器自己的手势，否则单指拖拽会被当成滚动页面，
     游戏根本收不到 pointermove */
  canvas { display:block; width:100%; height:100%;
           touch-action:none; -ms-touch-action:none;
           -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; }
  #app { touch-action:none; overscroll-behavior:none; }

  /* ---------- HUD ---------- */
  #hud { position:fixed; inset:0; pointer-events:none; z-index:5;
         opacity:0; transition:opacity 1.6s ease 0.4s; }
  #hud.on { opacity:1; }
  .corner { position:absolute; color:#fff; text-shadow:0 1px 12px rgba(0,0,0,.55); user-select:none; }
  #weather { top:26px; left:30px; font-size:13px; letter-spacing:.22em; opacity:.72; font-weight:300;
             pointer-events:auto; cursor:pointer; padding:6px 10px; margin:-6px -10px; border-radius:4px;
             -webkit-tap-highlight-color:transparent; transition:background .25s ease; }
  #weather:hover, #weather:active { background:rgba(255,255,255,.10); }
  #weather b { display:block; font-size:23px; letter-spacing:.32em; font-weight:300; margin-bottom:5px; opacity:.95; }
  #bloomCount { top:26px; right:30px; text-align:right; font-size:12px; letter-spacing:.2em; opacity:.6; font-weight:300; }
  #bloomCount b { display:block; font-size:26px; font-weight:200; letter-spacing:.06em; opacity:.95; margin-bottom:2px;
                  font-variant-numeric:tabular-nums; }
  #hint { bottom:24px; left:50%; transform:translateX(-50%); font-size:12px; letter-spacing:.19em;
          opacity:.42; font-weight:300; white-space:nowrap; text-align:center; }
  #hint kbd { font:inherit; border:1px solid rgba(255,255,255,.35); border-radius:4px; padding:1px 6px; margin:0 1px; }
  #hint .touch { display:none; }
  @media (pointer: coarse) {
    #hint .keys { display:none; }
    #hint .touch { display:inline; }
    /* 竖屏手机只有 390 点宽：提示必须换行，否则两头会被裁掉 */
    #hint { font-size:11px; letter-spacing:.10em; white-space:normal; line-height:2.0;
            width:calc(100vw - 40px); max-width:330px;
            bottom:calc(16px + env(safe-area-inset-bottom, 0px)); }
    #weather { top:calc(14px + env(safe-area-inset-top, 0px)); left:calc(14px + env(safe-area-inset-left, 0px)); }
    #bloomCount { top:calc(14px + env(safe-area-inset-top, 0px)); right:calc(14px + env(safe-area-inset-right, 0px)); }
    #intro h1 { font-size:48px; }
    #toast { font-size:24px; }
    #sound { bottom:auto; top:calc(74px + env(safe-area-inset-top, 0px)); right:calc(14px + env(safe-area-inset-right, 0px)); }
  }
  #sound { position:absolute; bottom:58px; right:26px; width:38px; height:38px; border-radius:50%;
           border:1px solid rgba(255,255,255,.26); background:rgba(255,255,255,.05); color:#fff;
           cursor:pointer; pointer-events:auto; padding:0; display:flex; align-items:center;
           justify-content:center; -webkit-tap-highlight-color:transparent;
           transition:background .25s ease, opacity .25s ease; }
  #sound:hover { background:rgba(255,255,255,.14); }
  #sound .x { display:none; }
  #sound.off { opacity:.45; }
  #sound.off .w1, #sound.off .w2 { display:none; }
  #sound.off .x { display:inline; }
  #toast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:6;
           color:#fff; font-size:30px; font-weight:200; letter-spacing:.5em; text-indent:.5em;
           text-shadow:0 2px 30px rgba(0,0,0,.6); opacity:0; pointer-events:none;
           transition:opacity .9s ease, transform .9s ease; }
  #toast.show { opacity:.92; }

  /* ---------- 开场 ---------- */
  #intro { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column;
           align-items:center; justify-content:center; gap:26px;
           background:radial-gradient(120% 90% at 50% 42%, #1d2a33 0%, #0b1016 72%);
           transition:opacity 1.5s ease; color:#fff; }
  #intro.hide { opacity:0; pointer-events:none; }
  #intro h1 { margin:0; font-size:64px; font-weight:200; letter-spacing:.42em; text-indent:.42em; opacity:.96; }
  #intro .sub { font-size:13px; letter-spacing:.42em; text-indent:.42em; opacity:.5; font-weight:300; margin-top:-12px; }
  #bar { width:210px; height:1px; background:rgba(255,255,255,.16); overflow:hidden; }
  #bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#ffd9a0,#fff); transition:width .35s ease; }
  #status { font-size:11px; letter-spacing:.3em; opacity:.36; font-weight:300; min-height:14px; }
  #start { pointer-events:auto; cursor:pointer; margin-top:6px; padding:13px 40px; opacity:0;
           border:1px solid rgba(255,255,255,.3); border-radius:2px; background:rgba(255,255,255,.03);
           color:#fff; font:inherit; font-size:13px; letter-spacing:.42em; text-indent:.42em; font-weight:300;
           transition:opacity .8s ease, background .3s ease, border-color .3s ease; }
  #start.on { opacity:1; }
  #start:hover { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.6); }
  #err { position:fixed; inset:0; z-index:40; display:none; padding:36px; overflow:auto;
         background:#160d0d; color:#ffb4b4; font-family:ui-monospace,Menlo,Consolas,monospace;
         font-size:12px; line-height:1.7; white-space:pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>

<div id="hud">
  <div class="corner" id="weather"><b>晴</b><span>微风</span></div>
  <div class="corner" id="bloomCount"><b>0</b><span>朵花已绽放</span></div>
  <button class="corner" id="sound" aria-label="开关声音" title="开关声音（M）">
    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linecap="round">
      <path d="M4 9.4v5.2h3.3L12 18.6V5.4L7.3 9.4H4z" fill="currentColor" stroke="none"/>
      <path class="w1" d="M15.1 9.3a3.7 3.7 0 0 1 0 5.4"/>
      <path class="w2" d="M17.7 6.8a7.3 7.3 0 0 1 0 10.4"/>
      <path class="x" d="M15.6 9.6l4.8 4.8M20.4 9.6l-4.8 4.8"/>
    </svg>
  </button>
  <div class="corner" id="hint">
    <span class="keys"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> / 拖拽 引导花瓣 &nbsp;·&nbsp;
    <kbd>Shift</kbd> 疾风 &nbsp;·&nbsp; <kbd>空格</kbd> 停驻·近景 &nbsp;·&nbsp;
    <kbd>R</kbd>/<kbd>F</kbd> 升降 &nbsp;·&nbsp; <kbd>C</kbd> 天气 &nbsp;·&nbsp; <kbd>H</kbd> 隐藏界面</span>
    <span class="touch">单指拖拽 引导花瓣 · 松开 停驻近景<br>双指 转视角 · 点左上角 换天气</span>
  </div>
</div>
<div id="toast"></div>

<div id="intro">
  <h1>花</h1>
  <div class="sub">F L O W E R</div>
  <div id="bar"><i></i></div>
  <div id="status">正在生成大地…</div>
  <button id="start">开 始 旅 途</button>
  <div class="sub" style="font-size:11px; letter-spacing:.3em; opacity:.34; margin-top:2px;">建 议 开 启 声 音</div>
</div>

<pre id="err"></pre>

<script>
  window.__errors = [];
  function showErr(msg){
    window.__errors.push(msg);
    var e = document.getElementById('err');
    e.style.display = 'block';
    e.textContent += msg + "\n\n";
  }
  window.addEventListener('error', function(ev){
    showErr('[error] ' + (ev.message||'') + '\n' + (ev.filename||'') + ':' + (ev.lineno||'') +
            (ev.error && ev.error.stack ? '\n' + ev.error.stack : ''));
  });
  window.addEventListener('unhandledrejection', function(ev){
    var r = ev.reason;
    showErr('[promise] ' + (r && (r.stack || r.message) ? (r.stack||r.message) : String(r)));
  });
</script>
