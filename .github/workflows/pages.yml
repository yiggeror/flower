# 把游戏部署到 GitHub Pages。
# 推到 main 就自动跑，产出 https://<用户名>.github.io/<仓库名>/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装打包依赖
        run: npm install --no-audit --no-fund

      - name: 生成单文件版本
        run: node build.mjs

      - name: 首次部署时自动开启 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 组装站点
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r src vendor _site/
          if [ -d audio ]; then cp -r audio _site/; fi
          mkdir -p _site/download
          cp dist/flower.html _site/download/flower.html
          touch _site/.nojekyll
          ls -R _site | head -40

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
