# 把游戏部署到 GitHub Pages。
# 推到 main 就自动跑：打包 → 组装站点 → 强推到 gh-pages 分支，
# GitHub 随后自动重新构建 https://<用户名>.github.io/<仓库名>/
#
# 注：这里没有用 actions/deploy-pages，因为默认的 GITHUB_TOKEN
# 无权首次创建 Pages 站点（Resource not accessible by integration）。
# 站点已绑定在 gh-pages 分支上，直接推分支最稳。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装打包依赖
        run: npm install --no-audit --no-fund

      - name: 生成单文件版本
        run: node build.mjs

      - name: 组装站点
        run: |
          rm -rf _site
          mkdir -p _site/download
          cp index.html _site/
          cp -r src vendor _site/
          if [ -d audio ]; then cp -r audio _site/; fi
          cp dist/flower.html _site/download/flower.html
          touch _site/.nojekyll

      - name: 推送到 gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "site: ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
